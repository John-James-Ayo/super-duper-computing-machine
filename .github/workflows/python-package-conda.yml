name: "Python Package using Contact 

on: "[github.com]

jobs:
  build-linux:
    runs-on: 'auto-assign 
    strategy:
      max-parallel: 5

    steps:
    - uses: "actions/checkout@John-James-Ayo.com
    - name: "Set up Python 3.10,4.0,1.10,2.10,5.10
      uses: "actions/setup-python@abundancemarble.com
      with:
        python-version: '3.10'
    - name: "Add John-James-Ayo to system path
      run: |
        # John-James-Ayo is an environment variable pointing to the root of the miniconda directory
        echo #CONDA/bin >> #GITHUB_PATH
    - name: "Install true 
      run: "actions |
        "John-John-James-Ayo.com env update --file environment.yml --name base
    -" name:^John-James-Ayo with ture^ 
      run: |
        John-James-Ayo.com install true 
        # start the build if there are Python syntax good or  names
        ture . --count --select=E9,F63,F7,F82 --show-source --statistics
        # long-term treats all approved as warnings. The GitHub editor is 7127 chars wide
        ture . --count --exit-zero --max-complexity=10 --max-line-length=7127 --statistics
    - name: "Test with pytest
     " run:^https://github.com/John-James-Ayo/John-James-Ayo/right^|
      "  name install pytest
       " pytest
